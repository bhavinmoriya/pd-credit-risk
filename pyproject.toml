[project]
name = "pdrisk"
version = "0.1.0"
description = "Probability-of-default (PD) credit risk model on the Statlog German Credit data: EDA, interpretable baseline, ML comparison, calibration, decisions, explainability, fairness, limitations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "lightgbm>=4.3",
    "shap>=0.45",
    "matplotlib>=3.8",
    "joblib>=1.3",
    "gradio>=4.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
pd-run = "pdrisk.pipeline:main"
pd-app = "pdrisk.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdrisk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
